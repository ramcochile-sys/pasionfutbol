<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración · Pasión Fútbol</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#090e18;color:#f5f8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px}
main{width:min(100%,410px);background:#101a2b;border:1px solid #344765;border-radius:14px;padding:24px}
strong{font-style:italic;color:#ffda28}
h1{font-size:26px;margin:12px 0 18px}
form,label{display:grid;gap:8px}
form{gap:16px}
input,button{width:100%;min-height:44px;border:1px solid #425575;border-radius:8px;background:#090e18;color:inherit;font:inherit;padding:8px 12px}
button{background:#16a34a;color:#06130a;font-weight:700;border:0;cursor:pointer}
a{color:#b9c6da}
[role="alert"]{color:#ffc1c1}
</style>
</head>
<body>
<main>
<strong>PASIÓN FÚTBOL</strong>
<h1>Administrar productos</h1>
<!-- LOGIN_ERROR -->
<form method="post" action="/admin/login">
<label>Usuario <input name="username" autocomplete="username" autocapitalize="none" maxlength="100" required></label>
<label>Contraseña <input type="password" name="password" autocomplete="current-password" maxlength="256" required></label>
<button type="submit">Entrar</button>
</form>
<p><a href="/">Volver a la tienda</a></p>
</main>
</body>
</html>
